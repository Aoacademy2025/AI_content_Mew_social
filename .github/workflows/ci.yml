name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Build-time only — no real secrets needed. Stripe/AI keys are looked up at runtime,
      # and prisma generate doesn't connect to the DB (a dummy URL is enough).
      DATABASE_URL: "file:./ci.db"
      NEXT_DISABLE_ESLINT: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify karaoke subtitle visibility
        run: npm run verify:subtitle-karaoke

      - name: Verify subtitle card invariants
        run: npm run verify:subtitle-invariant

      - name: Verify editor job runtime (idempotency + project recovery)
        run: npm run verify:editor-job-runtime

      - name: Verify Hero Script rollout, quota, and workflow
        run: npm run verify:hero-script

      - name: Build
        run: npm run build
