name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Build-time only — no real secrets needed. Stripe/AI keys are looked up at runtime,
      # and prisma generate doesn't connect to the DB (a dummy URL is enough).
      DATABASE_URL: "file:./ci.db"
      NEXT_DISABLE_ESLINT: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify post-launch stability hotfixes
        run: npm run verify:launch-stability-hotfix

      - name: Verify karaoke subtitle visibility
        run: npm run verify:subtitle-karaoke

      - name: Verify first-export subtitle and duration walls
        run: npm run verify:first-export-walls

      - name: Verify subtitle card invariants
        run: npm run verify:subtitle-invariant

      - name: Verify editor job runtime (idempotency + project recovery)
        run: npm run verify:editor-job-runtime

      - name: Verify first-clip convert prompt
        run: npm run verify:first-clip-convert

      - name: Verify Hero Script launch, payment, rollout, and guidance
        run: npm run verify:hero-script-launch

      - name: Verify Admin Insights revenue clarity
        run: npm run verify:admin-insights-revenue

      - name: Verify RunPod image active-route COGS
        run: npm run verify:runpod-image-cost

      - name: Build
        run: npm run build
