name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Build-time only — no real secrets needed. Stripe/AI keys are looked up at runtime,
      # and prisma generate doesn't connect to the DB (a dummy URL is enough).
      DATABASE_URL: "file:./ci.db"
      NEXT_DISABLE_ESLINT: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify post-launch stability hotfixes
        run: npm run verify:launch-stability-hotfix

      - name: Verify karaoke subtitle visibility
        run: npm run verify:subtitle-karaoke

      - name: Verify first-export subtitle and duration walls
        run: npm run verify:first-export-walls

      - name: Verify subtitle card invariants
        run: npm run verify:subtitle-invariant

      - name: Verify editor job runtime (idempotency + project recovery)
        run: npm run verify:editor-job-runtime

      - name: Verify first-clip convert prompt
        run: npm run verify:first-clip-convert
      - name: Verify gallery touch actions (#328)
        run: npm run verify:gallery-touch

      - name: Verify first-clip path
        run: npm run verify:first-clip-path

      - name: Verify Conversion Trial first-clip path
        run: npm run verify:trial-first-clip-path

      - name: Verify /pricing LCP convert page
        run: npm run verify:pricing-lcp

      - name: Verify /pricing default checkout selection (#300)
        run: npm run verify:pricing-defaults

      - name: Verify public pricing matches checkout and entitlements
        run: npm run verify:marketing-pricing

      - name: Verify public marketing copy uses plain Thai
        run: npm run verify:marketing-language

      - name: Verify day-21 GRANT convert reminder
        run: npm run verify:day21-convert-reminder

      - name: Verify Avatar caption fail-open
        run: npm run verify:avatar-caption-fallback

      - name: Verify Avatar composite overflow crop and timeout classify
        run: npm run verify:composite-stability

      - name: Verify Scene Reroll missing Visual Beat is 409
        run: npm run verify:hero-broll-window-migration

      - name: Verify cutaway Scene Reroll maps timeline windows to Visual Beats
        run: npm run verify:broll-window-management && npm run verify:broll-rerender

      - name: Verify customer-facing error copy
        run: npm run verify:customer-error-copy

      - name: Verify quota_exceeded surfaces an upgrade path
        run: npm run verify:quota-error-shape

      - name: Verify ERROR_SYSTEM capacity skip and rate-limit
        run: npm run verify:admin-error-notify

      - name: Verify Hero Script launch, payment, rollout, and guidance
        run: npm run verify:hero-script-launch

      - name: Verify Admin Insights revenue clarity
        run: npm run verify:admin-insights-revenue

      - name: Verify RunPod image active-route COGS
        run: npm run verify:runpod-image-cost

      - name: Verify Hero Voice stock and clone contracts
        run: npm run verify:omnivoice && npm run verify:hero-voice-clone

      - name: Verify /brands fits phones and keeps its desktop layout
        run: npm run verify:brands-mobile

      - name: Build
        run: npm run build
