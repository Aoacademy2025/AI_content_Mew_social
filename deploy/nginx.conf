# MCP Media Import upload link (Task 11, G26): PUT /api/mcp-uploads/<token>. The path segment
# IS the single-use upload token, so that location logs with this format: no request line, no
# URI, no referer. `log_format` is http-level — this file is included inside `http {}` (e.g.
# sites-enabled), so it must stay above the server blocks. Keep the name unique per host.
log_format heroai_mcp_upload_redacted '$remote_addr - - [$time_local] "$request_method /api/mcp-uploads/[redacted] $server_protocol" $status $body_bytes_sent $request_length $request_time "$http_user_agent"';

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;  # แก้ตรงนี้

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        root /var/www/heroai-maintenance;
        internal;
        add_header Retry-After "120" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # MCP upload links are https-only (Task 11). Never redirect one: the 301 would be logged here
    # in the default format with the live token, and invites a cleartext retry. Refuse in place,
    # logged redacted.
    location ^~ /api/mcp-uploads/ {
        access_log /var/log/nginx/access.log heroai_mcp_upload_redacted;
        error_log /var/log/nginx/error.log crit;
        default_type application/json;
        return 403 '{"error":"https_required","code":"https_required","message":"ลิงก์อัปโหลดใช้ได้เฉพาะ https","next":"เรียก create_upload_url เพื่อขอลิงก์ใหม่ แล้วอัปโหลดด้วย uploadUrl ที่ได้ (https) ตรงๆ"}';
    }

    location / {
        if (-f /var/www/ai-content/.deploy-maintenance) {
            return 503;
        }

        # Redirect HTTP → HTTPS
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;  # แก้ตรงนี้

    # SSL — ใช้ Certbot (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    error_page 503 /maintenance.html;

    # Self-contained deploy UI: it does not depend on Next.js or /_next assets,
    # which may be unavailable while the release is being swapped.
    location = /maintenance.html {
        root /var/www/heroai-maintenance;
        internal;
        add_header Retry-After "120" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Upload size — สำหรับ video upload
    client_max_body_size 500M;

    # Timeout — สำหรับ render/HeyGen ที่ใช้เวลานาน
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;

    # Gzip text assets (CSS/JS/JSON) for the proxied app + /_next/static.
    # Media (mp4/webm/jpg) is already compressed and is intentionally NOT listed.
    # Server-level so it applies to the proxy and both static location blocks below.
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_vary on;

    # Clerk's same-origin __session JWT is short-lived. Buffering a large request
    # before proxying it can leave the token expired by the time Next.js authenticates
    # the request. Stream only the authenticated large-upload routes to the app so
    # auth runs while the token attached at upload start is still fresh.
    location = /api/internal/story-film-media/presenter-upload {
        if (-f /var/www/ai-content/.deploy-maintenance) {
            return 503;
        }

        client_max_body_size 510M;
        proxy_request_buffering off;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This route authenticates only the short-lived upload bearer grant.
        # Keep service impersonation headers private to on-host callers.
        proxy_set_header x-heroai-service-secret "";
        proxy_set_header x-heroai-act-as "";
        proxy_cache_bypass $http_upgrade;
    }

    # MCP Media Import upload link (Task 11, G26). Authenticated only by the single-use token in
    # the path (checked by the app; the Next proxy is skipped for this path). Streamed to the app
    # so the route enforces the per-kind byte cap while reading (image 20 MB / video 200 MB /
    # presenter 500 MB); 510M here is the outer bound.
    #
    # The path is a LIVE credential until the app consumes it, so every response path stays in a
    # redacted location — nginx writes the access log with the settings of the location a
    # request FINISHES in:
    #   - error_page here replaces the server's `error_page 503 /maintenance.html` (that internal
    #     redirect would log the full request line in the default format); the maintenance 503
    #     goes to @mcp_upload_unavailable instead, and nginx's own 413/502/504 pages are served
    #     from this location.
    #   - error_log is raised to crit: nginx's error lines (e.g. "client intended to send too
    #     large body", upstream resets) quote the request line and cannot be reformatted. Upload
    #     diagnostics: the redacted access log (status, bytes, time) + the app's own replies.
    location ^~ /api/mcp-uploads/ {
        access_log /var/log/nginx/access.log heroai_mcp_upload_redacted;
        error_log /var/log/nginx/error.log crit;
        error_page 503 @mcp_upload_unavailable;

        if (-f /var/www/ai-content/.deploy-maintenance) {
            return 503;
        }

        client_max_body_size 510M;
        proxy_request_buffering off;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-heroai-service-secret "";
        proxy_set_header x-heroai-act-as "";
    }

    # Maintenance answer for upload links: same redacted logging, JSON instead of the HTML page.
    # `return` with a body is sent as is (no further error_page), so the request ends here.
    location @mcp_upload_unavailable {
        access_log /var/log/nginx/access.log heroai_mcp_upload_redacted;
        error_log /var/log/nginx/error.log crit;
        default_type application/json;
        add_header Retry-After "120" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"maintenance","code":"maintenance","message":"ระบบกำลังอัปเดตชั่วคราว","next":"รอประมาณ 2 นาที แล้ว PUT ไฟล์เดิมด้วยลิงก์เดิมอีกครั้ง (ลิงก์ยังใช้ได้จนหมดอายุ)"}';
    }

    location ~ ^/api/(?:videos/(?:upload-avatar|upload|broll-window/upload)|music/upload)$ {
        if (-f /var/www/ai-content/.deploy-maintenance) {
            return 503;
        }

        proxy_request_buffering off;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-heroai-service-secret "";
        proxy_set_header x-heroai-act-as "";
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        # First-rollout + steady-state ingress barrier. Internal workers call
        # 127.0.0.1:3000 directly and can finish existing work while this is present.
        if (-f /var/www/ai-content/.deploy-maintenance) {
            return 503;
        }

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strip internal MCP service-auth headers from ALL inbound client traffic — only the
        # in-process worker (which hits 127.0.0.1:3000 directly, bypassing Nginx) may set them.
        # Without this, a leaked MCP_SERVICE_SECRET would allow account impersonation from the internet.
        proxy_set_header x-heroai-service-secret "";
        proxy_set_header x-heroai-act-as "";
        proxy_cache_bypass $http_upgrade;
    }

    # Static files — serve โดยตรงจาก Nginx (เร็วกว่า Next.js)
    location /_next/static/ {
        if (-f /var/www/ai-content/.deploy-maintenance) {
            return 503;
        }

        alias /var/www/ai-content/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /renders/ {
        if (-f /var/www/ai-content/.deploy-maintenance) {
            return 503;
        }

        alias /var/www/ai-content/public/renders/;
        try_files $uri @media_storage_fallback;
        expires 7d;
    }

    location ^~ /api/renders/ {
        if (-f /var/www/ai-content/.deploy-maintenance) {
            return 503;
        }

        alias /var/www/ai-content/public/renders/;
        try_files $uri @media_storage_fallback;
        expires 7d;
    }

    location /stocks/ {
        if (-f /var/www/ai-content/.deploy-maintenance) {
            return 503;
        }

        alias /var/www/ai-content/stocks/;
        try_files $uri @media_storage_fallback;
        expires 7d;
    }

    location ^~ /api/stocks/ {
        if (-f /var/www/ai-content/.deploy-maintenance) {
            return 503;
        }

        alias /var/www/ai-content/stocks/;
        try_files $uri @media_storage_fallback;
        expires 7d;
    }

    # Preserve Nginx's local-file fast path while allowing media evicted from
    # the VPS to resolve through the application's R2-first read adapter.
    location @media_storage_fallback {
        rewrite ^/(?:api/)?(renders|stocks)/(.*)$ /api/$1/$2 break;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-heroai-service-secret "";
        proxy_set_header x-heroai-act-as "";
    }
}
